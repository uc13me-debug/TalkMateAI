name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # Force install Capacitor CLI just in case
      - name: Install Capacitor CLI
        run: pnpm add -g @capacitor/cli

      - name: Build Web Assets
        run: pnpm --filter @talkmateai/client run build

      - name: Sync Capacitor
        run: pnpm --filter @talkmateai/client exec cap sync android
        
      - name: Build APK
        working-directory: ./apps/client/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/client/android/app/build/outputs/apk/debug/app-debug.apk