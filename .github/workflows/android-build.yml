name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Add JDK 21 setup required for Android SDK 34 compilation
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Install Capacitor CLI
        run: pnpm add -g @capacitor/cli

      - name: Build Web Assets
        working-directory: ./apps/client
        run: pnpm run build --no-lint

      - name: Sync Capacitor
        working-directory: ./apps/client
        run: npx cap sync android
        
      - name: Grant Execute Permission
        working-directory: ./apps/client/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ./apps/client/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/client/android/app/build/outputs/apk/debug/app-debug.apk